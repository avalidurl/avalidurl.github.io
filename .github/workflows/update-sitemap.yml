name: Update sitemap

on:
  schedule:
    # 09:00 Europe/Istanbul (UTC+3)
    - cron: "0 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [journal-post]

permissions:
  contents: write

concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate sitemap from gokhanturhan.com
        run: python3 scripts/generate-sitemap.py

      - name: Commit if changed
        run: |
          git config user.name "Gökhan Turhan"
          git config user.email "11991363+avalidurl@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: refresh sitemap from gokhanturhan.com"
          git push
